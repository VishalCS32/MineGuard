# Gateways publish telemetry here; the API subscribes and publishes downlink commands.
persistence true
persistence_location /mosquitto/data/

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Prototype/demo posture: open on the local network. Before any real deployment,
# switch to per-gateway credentials + TLS -- see docs/security.md.
allow_anonymous true

log_dest stdout
log_type warning
log_type error
connection_messages true
